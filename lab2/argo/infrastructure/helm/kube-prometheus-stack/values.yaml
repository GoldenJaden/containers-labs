alertmanager:
  ingress:
    enabled: "true"
    ingressClassName: "nginx"
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.homelab.internal
    hosts:
      - alertmanager.homelab.internal
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
  config:
    route:
      group_by:
        - namespace
        - alertname
      receiver: telegram
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
            chat_id: 764516044
            send_resolved: true
            parse_mode: ""
            message: |-
              {{ if eq .Status "firing" }}🔥 АЛЯРМ{{ else }}✅ =Нормально={{ end }}
              {{ range .Alerts }}

              Alert: {{ .Labels.alertname }}
              Severity: {{ .Labels.severity }}
              Namespace: {{ .Labels.namespace }}
              {{ with .Labels.pod }}Pod: {{ . }}{{ end }}
              {{ with .Labels.instance }}Instance: {{ . }}{{ end }}
              {{ with .Annotations.summary }}Summary: {{ . }}{{ end }}
              {{ with .Annotations.description }}Description: {{ . }}{{ end }}
              Started: {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
              {{ with .GeneratorURL }}Source: {{ . }}{{ end }}
              {{ end }}
            http_config:
              proxy_url: http://192.168.0.51:2080
  alertmanagerSpec:
    secrets:
      - alertmanager-telegram

prometheus-node-exporter:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: scheduling.gjaden.dev/exclude-daemonsets
                operator: DoesNotExist
              - key: eks.amazonaws.com/compute-type
                operator: NotIn
                values:
                  - fargate
              - key: type
                operator: NotIn
                values:
                  - virtual-kubelet

prometheus:
  ingress:
    enabled: "true"
    ingressClassName: "nginx"
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.homelab.internal
    hosts:
      - prometheus.homelab.internal
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
  prometheusSpec:
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
       spec:
         accessModes: ["ReadWriteOnce"]
         resources:
           requests:
             storage: 10Gi

grafana:
  ingress:
    enabled: "true"
    ingressClassName: "nginx"
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.homelab.internal
    hosts:
      - grafana.homelab.internal
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
  persistence:
    enabled: true
    type: sts
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    finalizers:
      - kubernetes.io/pvc-protection
