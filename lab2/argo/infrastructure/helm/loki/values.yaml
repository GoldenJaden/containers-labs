deploymentMode: Monolithic

singleBinary:
  replicas: 1
  persistence:
    size: 10Gi

chunksCache:
  enabled: false
resultsCache:
  enabled: false

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 10d
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

gateway:
  ingress:
    enabled: true
    ingressClassName: "nginx"
    tls:
      - secretName: loki-tls
        hosts:
          - logs.homelab.internal
    hosts:
      - host: logs.homelab.internal
        paths:
          - path: /
            pathType: Prefix
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
