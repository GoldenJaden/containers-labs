apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "lab3-app.fullname" . }}-test-connection"
  labels:
    {{- include "lab3-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "lab3-app.fullname" . }}-api:{{ .Values.api.service.port }}/health']
  restartPolicy: Never
