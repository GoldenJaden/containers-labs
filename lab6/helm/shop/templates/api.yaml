{{- $root := . }}
{{- range $version, $settings := .Values.api.versions }}
{{- if $settings.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $root.Release.Name }}-api-{{ $version }}
  labels: {{- include "shop.labels" $root | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-api-{{ $version }}
  labels: {{- include "shop.labels" $root | nindent 4 }}
spec:
  replicas: {{ $settings.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels: {lab_release: {{ $root.Release.Name }}, lab_component: api, lab_version: {{ $version }}}
  template:
    metadata:
      labels:
        {{- include "shop.labels" $root | nindent 8 }}
        lab_component: api
        lab_version: {{ $version }}
      annotations:
        {{- include "shop.annotations" $root | nindent 8 }}
        {{- with $root.Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $root.Release.Name }}-api-{{ $version }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: api
          image: "{{ $root.Values.api.image.repository }}:{{ $root.Values.api.image.tag }}"
          imagePullPolicy: {{ $root.Values.api.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ $root.Values.api.port }}}
            - {name: metrics, containerPort: 9090}
          env:
            - {name: VERSION, value: {{ $version | quote }}}
            - {name: FAIL, value: {{ $settings.fail | quote }}}
            - {name: FLAKY, value: {{ $settings.flaky | quote }}}
            - {name: FLAKY_RATE, value: {{ $root.Values.api.flakyRate | quote }}}
            - {name: PGHOST, value: "{{ $root.Release.Name }}-postgres"}
            - {name: PGPORT, value: "5432"}
            - {name: PGDATABASE, value: {{ $root.Values.database.name | quote }}}
            - {name: PGUSER, value: {{ $root.Values.database.user | quote }}}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $root.Release.Name }}-postgres, key: password}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {{- toYaml $root.Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-api-{{ $version }}
  labels:
    {{- include "shop.labels" $root | nindent 4 }}
    lab_component: api
    lab_version: {{ $version }}
spec:
  selector: {lab_release: {{ $root.Release.Name }}, lab_component: api, lab_version: {{ $version }}}
  ports:
    - {name: http, port: {{ $root.Values.api.port }}, targetPort: http, appProtocol: http}
    - {name: metrics, port: 9090, targetPort: metrics}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  # Unmeshed requests go to v1. Meshed clients use HTTPRoute instead.
  selector: {lab_release: {{ .Release.Name }}, lab_component: api, lab_version: v1}
  ports:
    - {name: http, port: {{ .Values.api.port }}, targetPort: http, appProtocol: http}
