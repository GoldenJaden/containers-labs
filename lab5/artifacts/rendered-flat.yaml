apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-network-dashboard
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: shop
    app.kubernetes.io/managed-by: Helm
    grafana_dashboard: "1"
data:
  lab5-network.json: |
    {
      "uid": "lab5-zero-trust",
      "title": "Lab 5 \u2014 Zero Trust",
      "tags": [
        "lab5",
        "network"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Lab5 network flows",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (verdict) (rate(hubble_flows_processed_total{source_namespace=\"lab5\"}[1m]))",
              "legendFormat": "{{verdict}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Policy drops",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "pps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (source,destination) (rate(hubble_drop_total{reason=\"POLICY_DENIED\",source_namespace=\"lab5\"}[1m])) or vector(0)",
              "legendFormat": "{{source}} \u2192 {{destination}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "TCP connections",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (flag) (rate(hubble_tcp_flags_total{source_namespace=\"lab5\"}[1m]))",
              "legendFormat": "{{flag}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "CoreDNS responses (cluster)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (rcode) (rate(coredns_dns_responses_total[1m]))",
              "legendFormat": "{{rcode}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "API requests during pod churn",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status_code) (rate(api_http_requests_total{namespace=\"lab5\",route=\"/order\"}[1m]))",
              "legendFormat": "{{status_code}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Ready API and worker replicas",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
