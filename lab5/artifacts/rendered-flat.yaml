apiVersion: v1
kind: Service
metadata:
  name: shop-api
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: shop
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
