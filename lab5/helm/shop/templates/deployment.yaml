{{- range $name := list "api" "worker" }}
{{- $c := index $.Values $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $c.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "shop.selector" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "shop.selector" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: {{ $name }}
          image: {{ $c.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          ports:
            - {name: http, containerPort: {{ $c.port }}}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $.Values.database.name }}-app, key: uri}
            {{- if eq $name "worker" }}
            - {name: POLL_INTERVAL_SECONDS, value: "1"}
            {{- end }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: [python, -c, "import time; time.sleep(8)"]
          resources:
            {{- toYaml $c.resources | nindent 12 }}
{{- end }}
