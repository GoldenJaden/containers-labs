{{- if .Values.loadTest.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-client-metrics
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: load-client
spec:
  selector:
    {{- toYaml .Values.networkPolicy.clientLabels | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.loadTest.metricsPort }}
      targetPort: {{ .Values.loadTest.metricsPort }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-client
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "shop.selector" . | nindent 6 }}
      app.kubernetes.io/component: load-client
  endpoints:
    - port: metrics
      interval: 5s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-client-metrics
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.networkPolicy.clientLabels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.prometheusLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.loadTest.metricsPort }}
{{- end }}
